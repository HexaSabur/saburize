<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Sayacı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pomodoro-container">
        <h1 class="title">Odaklanma Zamanı</h1>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="mode-indicator" id="modeIndicator">Çalışma Süresi</div>
        <div class="controls">
            <button id="startBtn" class="btn primary">Başlat</button>
            <button id="pauseBtn" class="btn secondary">Duraklat</button>
            <button id="resetBtn" class="btn danger">Sıfırla</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
